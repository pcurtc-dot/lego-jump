</style></head><body><canvas id="c" width="960" height="540"></canvas>
<div id="ui"><div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div><div class="btn" id="bj">⤒</div><button id="mute">🔊</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540,G=440;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px';C.style.marginTop=(innerHeight-H*s)/2+'px'}addEventListener('resize',fit);fit();
if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
// ---- audio
let AC=null,muted=false,musicT=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',v=.12,slide=0,t0=0){const a=ac();if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={jump:()=>tone(300,.2,'square',.1,700),collect:()=>{tone(880,.08,'triangle',.15);tone(1320,.15,'triangle',.15,0,.08)},ouch:()=>{tone(400,.35,'sawtooth',.12,120)},over:()=>[523,392,330,262].forEach((f,i)=>tone(f,.25,'triangle',.15,0,i*.22)),treasure:()=>[784,988,1175,1568,1175,1568].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.1)),level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'triangle',.15,0,i*.12))};
const mel=[523,587,659,523,659,784,659,0,698,659,587,523,587,659,523,0],bass=[131,131,175,175,196,196,131,131];let mi=0;
function startMusic(){if(musicT)return;musicT=setInterval(()=>{if(state==='play'){const f=mel[mi%16];if(f)tone(f,.18,'triangle',.05);if(mi%2==0)tone(bass[(mi/2|0)%8],.3,'sine',.07)}mi++},220)}
document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊';e.target.blur()};
// ---- input
const K={};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Space'].includes(e.key)||e.code=='Space')e.preventDefault();K[e.code]=1;if(e.code=='Space'||e.code=='ArrowUp'||e.code=='KeyW')jumpPress();if(e.code=='Enter'&&state!='play')clickAt(W/2,330)});addEventListener('keyup',e=>K[e.code]=0);
let TL=0,TR=0;function hold(id,set){const b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();set(1)},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();set(0)});b.addEventListener('mousedown',()=>set(1));b.addEventListener('mouseup',()=>set(0))}
hold('bl',v=>TL=v);hold('br',v=>TR=v);hold('bj',v=>{if(v)jumpPress();jumpHeld=v});
let jumpHeld=0;
function cpos(e){const r=C.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*W/r.width,(p.clientY-r.top)*H/r.height]}
C.addEventListener('mousedown',e=>{const[x,y]=cpos(e);clickAt(x,y)});C.addEventListener('touchstart',e=>{e.preventDefault();const[x,y]=cpos(e);clickAt(x,y)},{passive:false});
// ---- state
let state='title',diff='easy',P,obs,items,parts,camX,score,dist,lives,level,inv,t=0,best=+localStorage.lj_best||0,msg=0,spawnX;
const D={easy:{lives:5,spd:.9,gap:1.05,boss:.8,hp:3},normal:{lives:3,spd:1.3,gap:.8,boss:1.05,hp:4}};
function clickAt(x,y){ac();startMusic();if(state=='title'){if(y>212&&y<268){if(x<W/2)diff='easy';else diff='normal';sfx.collect();return}if(y>290&&y<360&&x>W/2-120&&x<W/2+120)start()}else if(state=='over'){if(y>330&&y<420)start()}else if(state=='play')jumpPress(true)}
function start(){state='play';P={x:120,y:G-70,vx:0,vy:0,w:40,h:70,on:true,face:1,anim:0,coy:0,buf:0};obs=[];items=[];parts=[];camX=0;score=0;dist=0;lives=D[diff].lives;level=1;inv=60;spawnX=700;msg=120;endX=120+150*40;tre=null;treT=0;shots=[];B=null;placeT();}
let endX=0,tre=null,treT=0,arenaX=0,cage=true,B=null,shots=[],bossMsg=0,shake=0;
const BOSS=[{typ:'car',name:'Turbo Racer',w:130,h:62},{typ:'bear',name:'Big Bertie Bear',w:120,h:130},{typ:'army',name:'Sergeant Greenboots',w:64,h:118},{typ:'hero',name:'Captain Cape-Tastic',w:70,h:100}];
function poof(x,y){for(let i=0;i<8;i++)parts.push({x,y,vx:Math.random()*6-3,vy:-Math.random()*4,l:25,c:'#fff',s:'✦'})}
function placeT(){arenaX=endX-760;cage=true;B=null;const k=level%2?'bear':'jar';for(let i=0;i<2;i++)obs.push({k:'block',x:endX,y:G-50*(i+1),w:50,h:50,c:BC[(level+i)%6],l:'AB'[i],solid:1,ped:1});tre={x:endX+25,y:G-100,k};}
function jumpPress(tap){if(state!='play')return;P.buf=8;if(tap)P.tap=1}
const BC=['#e53935','#1e88e5','#fdd835','#43a047','#fb8c00','#8e24aa'];
function spawn(){const d=D[diff],lv=Math.min(level,6);while(spawnX<camX+W+300){if(cage&&spawnX>arenaX-320)return;if(spawnX<endX+250&&spawnX>arenaX-320)spawnX=endX+250;const r=Math.random();let x=spawnX,ext=0;
 if(r<.26){obs.push({k:'lego',x,y:G-22,w:44+(Math.random()*2|0)*22,h:22,c:BC[Math.random()*6|0]});if(Math.random()<.45){obs.push({k:'lego',x:x+150,y:G-22,w:44,h:22,c:BC[Math.random()*6|0]});ext=150}}
 else if(r<.46){const n=1+(Math.random()*Math.min(lv+1,3)|0);for(let i=0;i<n;i++)obs.push({k:'block',x,y:G-50*(i+1),w:50,h:50,c:BC[(Math.random()*6)|0],l:'ABCDEFGHIJ'[Math.random()*10|0],solid:1});
   items.push({x:x+25,y:G-50*n-50,got:0});if(Math.random()<.5){obs.push({k:'lego',x:x+105,y:G-22,w:44,h:22,c:BC[Math.random()*6|0]});ext=110}}
 else if(r<.62){obs.push({k:'car',x:x+260,y:G-30,w:50,h:30,vx:-(2+lv*.35)*d.spd*(.8+Math.random()*.4),c:BC[Math.random()*6|0],rot:0})}
 else if(r<.74){obs.push({k:'ball',x:x+220,y:G-140,w:46,h:44,vx:-(1.4+lv*.25)*d.spd,vy:0,bounce:1,c:BC[0],rot:0})}
 else if(r<.86){obs.push({k:'mouse',x,x0:x,y:G-28,w:46,h:28,vx:-(1.3+lv*.2)*d.spd,patrol:1,rot:0})}
 else{for(let i=0;i<3;i++)items.push({x:x+i*45,y:G-110-Math.sin(i/2*Math.PI)*40,got:0})}
 spawnX+= ext+(210+Math.random()*190)*d.gap - lv*8}}
function startBoss(){const bd=BOSS[(level-1)%4],hp=D[diff].hp+(level>4?1:0);B=Object.assign({},bd,{x:arenaX+640,y:G-bd.h,hp,max:hp,st:'idle',tm:80,vx:0,vy:0,dir:-1,ko:0,cnt:0,fl:0});if(B.typ=='hero')B.y=110;bossMsg=160;obs=obs.filter(o=>!o.vx);sfx.level()}
function updBoss(){const b=B;if(b.dead)return;if(b.fl>0)b.fl--;
 if(b.ko){b.ko++;b.y+=b.vy;b.vy+=.35;b.x+=b.vx;if(b.ko%4==0)parts.push({x:b.x+b.w/2,y:b.y+20,vx:Math.random()*6-3,vy:-Math.random()*5,l:30,c:'#ffeb3b',s:'★'});if(b.ko>110){b.dead=1;cage=false;sfx.treasure();for(let i=0;i<20;i++)parts.push({x:tre.x,y:tre.y-30,vx:Math.random()*8-4,vy:-Math.random()*6,l:40,c:'#ffd600',s:'✦'})}return}
 const f=(1+(b.max-b.hp)/b.max*.9)*D[diff].boss,px=P.x+20,cx=b.x+b.w/2;b.tm-=f;
 if(b.st=='idle'){b.dir=px<cx?-1:1;
  if(b.typ=='army')b.x+=b.dir*1.3*f;
  if(b.typ=='hero'){b.y+=(110+Math.sin(t/15)*25-b.y)*.1;b.x+=(px-cx)*.012*f}
  if(b.tm<=0){b.st='tele';b.tm=55}}
 else if(b.st=='tele'){if(b.typ=='car'&&t%4==0)parts.push({x:b.dir<0?b.x+b.w:b.x,y:G-15,vx:-b.dir*2,vy:-1,l:20,c:'#9e9e9e',s:'●'});
  if(b.tm<=0){b.st='atk';b.cnt=0;
   if(b.typ=='car'){b.vx=b.dir*8.5*f;sfx.ouch()}
   if(b.typ=='bear'){b.vy=-15;b.vx=(px-cx)/58}
   if(b.typ=='army'){b.tm=70;b.fired=0}
   if(b.typ=='hero'){const tt=40/f;b.vx=(px-cx)/tt;b.vy=(G-b.h-b.y)/tt}}}
 else if(b.st=='atk'){
  if(b.typ=='car'){b.x+=b.vx;if(b.x<arenaX+5||b.x+b.w>arenaX+W-5){b.x=Math.max(arenaX+5,Math.min(b.x,arenaX+W-5-b.w));b.st='tired';b.tm=120;shake=15;sfx.ouch()}}
  if(b.typ=='bear'){b.vy+=.6;b.x+=b.vx;b.y+=b.vy;if(b.y+b.h>=G&&b.vy>0){b.y=G-b.h;shake=12;sfx.ouch();for(const s of[-1,1])shots.push({k:'wave',x:cx+s*60,y:G-14,vx:s*4.5*f,vy:0,r:14});for(let i=0;i<2;i++)shots.push({k:'puff',x:cx,y:b.y,vx:(i?1:-1)*(2+Math.random()*2)*f,vy:-9,r:12});b.cnt++;if(b.cnt<(b.hp<=b.max/2?3:2)){b.vy=-14;b.vx=(px-cx)/56}else{b.st='tired';b.tm=120}}}
  if(b.typ=='army'){const fire=[60,45,30];if(b.fired<3&&b.tm<fire[b.fired]){b.fired++;shots.push({k:'pellet',x:b.dir>0?b.x+b.w:b.x,y:b.y+48,vx:b.dir*6*f,vy:0,r:8});sfx.jump();if(b.fired==2)for(let i=0;i<2;i++)shots.push({k:'para',x:px+(i?90:-90)+Math.random()*40,y:-20,vx:0,vy:1.7*f,r:14})}if(b.tm<=0){b.st='tired';b.tm=110}}
  if(b.typ=='hero'){b.x+=b.vx;b.y+=b.vy;if(b.y+b.h>=G){b.y=G-b.h;b.st='tired';b.tm=110;shake=10;for(const s of[-1,1])shots.push({k:'wave',x:cx+s*40,y:G-14,vx:s*3.5*f,vy:0,r:12})}}}
 else if(b.st=='tired'){if(b.tm<=0){b.st=b.typ=='hero'?'up':'idle';b.tm=70}}
 else if(b.st=='up'){b.y-=4;if(b.y<=110){b.st='idle';b.tm=60}}
 b.x=Math.max(arenaX,Math.min(b.x,arenaX+W-b.w));
 const hb={x:b.x+6,y:b.y+4,w:b.w-12,h:b.h-4};
 if(hit(P,hb,4)){const top=P.vy>0&&P.y+P.h<b.y+32;
  if(top&&b.st=='tired'){b.hp--;b.fl=20;P.vy=-12;score+=25;sfx.collect();tone(200,.25,'square',.12,90);poof(px,b.y);inv=Math.max(inv,30);b.st=b.typ=='hero'?'up':'idle';b.tm=70;if(b.typ=='car'){b.vx=0}
   if(b.hp<=0){b.ko=1;b.vy=-10;b.vx=(cx<arenaX+W/2?-1:1)*2;score+=100;sfx.level();shots=[]}}
  else if(top){P.vy=-10;tone(500,.1,'sine',.1,300)}
  else if(b.st!='tired'){hurt();P.x+=px<cx?-50:50}}}
function updShots(){for(const s of shots){s.x+=s.vx;s.y+=s.vy;if(s.k=='puff'){s.vy+=.35;if(s.y>G-s.r)s.dead=1}if(s.k=='para'){s.x+=Math.sin(t/12+s.y)*.6;if(s.y>G-s.r)s.dead=1}
  if(s.x<camX-40||s.x>camX+W+40)s.dead=1;if(!s.dead&&hit(P,{x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2},5)){s.dead=1;hurt()}}shots=shots.filter(s=>!s.dead)}
function hit(a,b,s=8){return a.x+s<b.x+b.w-s&&a.x+a.w-s>b.x+s&&a.y+s<b.y+b.h&&a.y+a.h>b.y+s}
function hurt(){if(inv>0)return;lives--;inv=100;sfx.ouch();P.vy=-8;for(let i=0;i<10;i++)parts.push({x:P.x+20,y:P.y+30,vx:Math.random()*6-3,vy:-Math.random()*5,l:30,c:'#ff5252',s:'!'});if(lives<=0){state='over';sfx.over();best=Math.max(best,score);localStorage.lj_best=best}}
function update(){t++;if(state!='play')return;const d=D[diff];
 const L=K.ArrowLeft||K.KeyA||TL,R=K.ArrowRight||K.KeyD||TR;const spd=4.2;
 P.vx=R?spd:L?-spd*.9:P.vx*.8;if(R)P.face=1;if(L)P.face=-1;
 // gentle auto-walk via tap on mobile is not forced; kids can just hold right
 P.vy+=.55;if(P.vy>0&&!(K.Space||K.ArrowUp||jumpHeld))P.vy+=.15;P.coy=P.on?6:P.coy-1;const vy0=P.vy,was=P.on;P.sq=(P.sq||0)*.8;
 if(P.buf>0&&P.coy>0){P.vy=-12.5;P.on=false;P.coy=0;P.buf=0;sfx.jump();P.sq=-.16;if(P.tap&&!R&&!L)P.vx=0}P.buf--;P.tap=0;
 P.x+=P.vx;P.x=Math.max(camX,P.x);
 for(const o of obs)if(o.solid&&hit(P,o,2)){if(P.vx>0)P.x=o.x-P.w+2;else if(P.vx<0)P.x=o.x+o.w-2}
 P.y+=P.vy;P.on=false;if(P.y+P.h>=G){P.y=G-P.h;P.vy=0;P.on=true}
 for(const o of obs)if(o.solid&&P.x+P.w-4>o.x&&P.x+4<o.x+o.w){if(P.vy>=0&&P.y+P.h>o.y&&P.y+P.h-P.vy<=o.y+12){P.y=o.y-P.h;P.vy=0;P.on=true}else if(P.vy<0&&P.y<o.y+o.h&&P.y>o.y+o.h-16){P.y=o.y+o.h;P.vy=0}}
 if(!was&&P.on&&vy0>5)P.sq=.2;if(P.on&&Math.abs(P.vx)>.5)P.anim+=.3;
 if(B&&!B.dead){camX+=(arenaX-camX)*.12;P.x=Math.min(P.x,arenaX+W-P.w);P.x=Math.max(P.x,arenaX)}else camX=Math.max(camX,P.x-300);
 if(cage&&!B&&P.x>arenaX+60)startBoss();if(B)updBoss();updShots();if(shake>0)shake--;if(bossMsg>0)bossMsg--;dist=Math.max(dist,(P.x-120)/40|0);
 if(treT>0){treT--;if(t%3==0)parts.push({x:tre.x+Math.random()*80-40,y:tre.y-Math.random()*60,vx:Math.random()*4-2,vy:-Math.random()*3,l:40,c:'#ffd600',s:'✦'});if(treT==0){level++;msg=120;endX=tre.x+150*40;placeT();spawnX=Math.max(spawnX,camX+W)}}
 else if(tre&&!cage&&Math.abs(P.x+20-tre.x)<55&&Math.abs(P.y+35-(tre.y-25))<110){treT=150;score+=50;sfx.treasure();obs=obs.filter(o=>!(o.vx&&o.x>P.x))}
 spawn();
 for(const o of obs){if(o.vx){o.x+=o.vx;o.rot+=o.vx/15;if(o.patrol&&Math.abs(o.x-o.x0)>90){o.vx*=-1;o.x+=o.vx*2}if(o.bounce){o.vy+=.45;o.y+=o.vy;if(o.y+o.h>=G){o.y=G-o.h;o.vy=-10.5}}}
  if(!o.solid&&!o.dead&&hit(P,o,o.k=='lego'?8:6)){if(P.vy>0&&P.y+P.h<o.y+20&&o.k!='lego'){P.vy=-9;score+=5;sfx.jump();if(o.k=='mouse'){o.dead=1;o.vx=0;poof(o.x+20,o.y)}}else hurt()}}
 obs=obs.filter(o=>!o.dead);
 for(const it of items)if(!it.got&&Math.abs(P.x+20-it.x)<36&&Math.abs(P.y+35-it.y)<46){it.got=1;score+=10;sfx.collect();for(let i=0;i<6;i++)parts.push({x:it.x,y:it.y,vx:Math.random()*4-2,vy:-Math.random()*4,l:25,c:'#ffd600',s:'★'})}
 obs=obs.filter(o=>o.x>camX-200||o.ped);items=items.filter(i=>i.x>camX-100&&!i.got);
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.l--}parts=parts.filter(p=>p.l>0);
 if(inv>0)inv--;if(msg>0)msg--}
// ---- drawing
function rr(x,y,w,h,r,f){X.beginPath();X.roundRect?X.roundRect(x,y,w,h,r):X.rect(x,y,w,h);X.fillStyle=f;X.fill()}
function star(x,y,r,f){X.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r*.45:r;X.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}X.closePath();X.fillStyle=f;X.fill();X.strokeStyle='#f57f17';X.lineWidth=2;X.stroke()}
function bg(){const g=X.createLinearGradient(0,0,0,G);g.addColorStop(0,'#c9ecff');g.addColorStop(1,'#fff3d6');X.fillStyle=g;X.fillRect(0,0,W,G);
 // wallpaper stripes & windows parallax
 const o=-(camX*.3)%120;for(let x=o;x<W;x+=120){X.fillStyle='rgba(255,182,193,.25)';X.fillRect(x,0,60,G)}
 const o2=-(camX*.5)%700;for(let x=o2;x<W+700;x+=700){rr(x+80,60,160,120,10,'#fff');rr(x+90,70,140,100,6,'#7fd3ff');X.fillStyle='#fff';X.beginPath();X.arc(x+130,110,18,0,7);X.arc(x+150,105,22,0,7);X.fill();star(x+200,90,10,'#ffeb3b');
  rr(x+400,140,180,20,4,'#a1887f');for(let i=0;i<4;i++)rr(x+410+i*42,100,30,40,3,BC[i]);X.fillStyle='#8d6e63';X.font='bold 18px sans-serif';}
 // floor
 X.fillStyle='#d7a86e';X.fillRect(0,G,W,H-G);const o3=-camX%80;X.strokeStyle='#c4925a';X.lineWidth=3;for(let x=o3;x<W;x+=80){X.beginPath();X.moveTo(x,G);X.lineTo(x,H);X.stroke()}
 X.fillStyle='#a8d8a8';X.fillRect(0,G,W,8)}
function lego(o){const x=o.x-camX;rr(x,o.y,o.w,o.h,3,o.c);X.fillStyle='rgba(0,0,0,.15)';X.fillRect(x,o.y+o.h-5,o.w,5);for(let i=0;i<o.w/22;i++){rr(x+4+i*22,o.y-7,14,8,3,o.c);X.fillStyle='rgba(255,255,255,.4)';X.fillRect(x+6+i*22,o.y-6,4,3)}}
