<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lego Jump!</title><style>
html,body{margin:0;height:100%;background:#ffe9a8;overflow:hidden;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;touch-action:none;user-select:none}
canvas{display:block;margin:0 auto;background:#bfe8ff;max-width:100vw;max-height:100vh}
#ui{position:fixed;inset:0;pointer-events:none}
.btn{pointer-events:auto;position:absolute;bottom:16px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.75);border:4px solid #ff6b6b;font-size:36px;display:none;align-items:center;justify-content:center;color:#ff6b6b}
#bl{left:16px}#br{left:110px}#bj{right:20px;width:100px;height:100px;border-color:#4caf50;color:#4caf50}
#mute{pointer-events:auto;position:absolute;top:10px;right:10px;font-size:26px;background:#fff;border:3px solid #7c4dff;border-radius:12px;padding:2px 8px;cursor:pointer}
.touch .btn{display:flex}
</style></head><body><canvas id="c" width="960" height="540"></canvas>
<div id="ui"><div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div><div class="btn" id="bj">⤒</div><button id="mute">🔊</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540,G=440;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px';C.style.marginTop=(innerHeight-H*s)/2+'px'}addEventListener('resize',fit);fit();
if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
// ---- audio
let AC=null,muted=false,musicT=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',v=.12,slide=0,t0=0){const a=ac();if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={jump:()=>tone(300,.2,'square',.1,700),collect:()=>{tone(880,.08,'triangle',.15);tone(1320,.15,'triangle',.15,0,.08)},ouch:()=>{tone(400,.35,'sawtooth',.12,120)},over:()=>[523,392,330,262].forEach((f,i)=>tone(f,.25,'triangle',.15,0,i*.22)),level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'triangle',.15,0,i*.12))};
const mel=[523,587,659,523,659,784,659,0,698,659,587,523,587,659,523,0],bass=[131,131,175,175,196,196,131,131];let mi=0;
function startMusic(){if(musicT)return;musicT=setInterval(()=>{if(state==='play'){const f=mel[mi%16];if(f)tone(f,.18,'triangle',.05);if(mi%2==0)tone(bass[(mi/2|0)%8],.3,'sine',.07)}mi++},220)}
document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊';e.target.blur()};
// ---- input
const K={};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Space'].includes(e.key)||e.code=='Space')e.preventDefault();K[e.code]=1;if(e.code=='Space'||e.code=='ArrowUp'||e.code=='KeyW')jumpPress();if(e.code=='Enter'&&state!='play')clickAt(W/2,330)});addEventListener('keyup',e=>K[e.code]=0);
let TL=0,TR=0;function hold(id,set){const b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();set(1)},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();set(0)});b.addEventListener('mousedown',()=>set(1));b.addEventListener('mouseup',()=>set(0))}
hold('bl',v=>TL=v);hold('br',v=>TR=v);hold('bj',v=>{if(v)jumpPress();jumpHeld=v});
let jumpHeld=0;
function cpos(e){const r=C.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*W/r.width,(p.clientY-r.top)*H/r.height]}
C.addEventListener('mousedown',e=>{const[x,y]=cpos(e);clickAt(x,y)});C.addEventListener('touchstart',e=>{e.preventDefault();const[x,y]=cpos(e);clickAt(x,y)},{passive:false});
// ---- state
let state='title',diff='easy',P,obs,items,parts,camX,score,dist,lives,level,inv,t=0,best=+localStorage.lj_best||0,msg=0,spawnX;
const D={easy:{lives:5,spd:.7,gap:1.4},normal:{lives:3,spd:1,gap:1}};
function clickAt(x,y){ac();startMusic();if(state=='title'){if(y>270&&y<330){if(x<W/2)diff='easy';else diff='normal';sfx.collect();return}if(y>350&&y<430&&x>W/2-120&&x<W/2+120)start()}else if(state=='over'){if(y>330&&y<420)start()}else if(state=='play')jumpPress(true)}
function start(){state='play';P={x:120,y:G-70,vx:0,vy:0,w:40,h:70,on:true,face:1,anim:0,coy:0,buf:0};obs=[];items=[];parts=[];camX=0;score=0;dist=0;lives=D[diff].lives;level=1;inv=60;spawnX=700;msg=120;}
function jumpPress(tap){if(state!='play')return;P.buf=8;if(tap)P.tap=1}
const BC=['#e53935','#1e88e5','#fdd835','#43a047','#fb8c00','#8e24aa'];
function spawn(){const d=D[diff],lv=Math.min(level,6);while(spawnX<camX+W+300){const r=Math.random();let x=spawnX;
 if(r<.35){obs.push({k:'lego',x,y:G-22,w:44+(Math.random()*2|0)*22,h:22,c:BC[Math.random()*6|0]})}
 else if(r<.6){const n=1+(Math.random()*Math.min(lv,3)|0);for(let i=0;i<n;i++)obs.push({k:'block',x,y:G-50*(i+1),w:50,h:50,c:BC[(Math.random()*6)|0],l:'ABCDEFGHIJ'[Math.random()*10|0],solid:1});
   items.push({x:x+25,y:G-50*n-50,got:0})}
 else if(r<.75&&level>=2){obs.push({k:Math.random()<.5?'car':'ball',x:x+200,y:G-30,w:50,h:30,vx:-(1.2+lv*.3)*d.spd,c:BC[Math.random()*6|0],rot:0})}
 else{for(let i=0;i<3;i++)items.push({x:x+i*45,y:G-110-Math.sin(i/2*Math.PI)*40,got:0})}
 spawnX+= (260+Math.random()*220)*d.gap - Math.min(lv,6)*10}}
function hit(a,b,s=8){return a.x+s<b.x+b.w-s&&a.x+a.w-s>b.x+s&&a.y+s<b.y+b.h&&a.y+a.h>b.y+s}
function hurt(){if(inv>0)return;lives--;inv=120;sfx.ouch();P.vy=-8;for(let i=0;i<10;i++)parts.push({x:P.x+20,y:P.y+30,vx:Math.random()*6-3,vy:-Math.random()*5,l:30,c:'#ff5252',s:'!'});if(lives<=0){state='over';sfx.over();best=Math.max(best,score);localStorage.lj_best=best}}
function update(){t++;if(state!='play')return;const d=D[diff];
 const L=K.ArrowLeft||K.KeyA||TL,R=K.ArrowRight||K.KeyD||TR;const spd=4.2;
 P.vx=R?spd:L?-spd*.9:P.vx*.8;if(R)P.face=1;if(L)P.face=-1;
 // gentle auto-walk via tap on mobile is not forced; kids can just hold right
 P.vy+=.55;if(P.vy>0&&!(K.Space||K.ArrowUp||jumpHeld))P.vy+=.15;P.coy=P.on?8:P.coy-1;
 if(P.buf>0&&P.coy>0){P.vy=-12.5;P.on=false;P.coy=0;P.buf=0;sfx.jump();if(P.tap&&!R&&!L)P.vx=0}P.buf--;P.tap=0;
 P.x+=P.vx;P.x=Math.max(camX,P.x);
 for(const o of obs)if(o.solid&&hit(P,o,2)){if(P.vx>0)P.x=o.x-P.w+2;else if(P.vx<0)P.x=o.x+o.w-2}
 P.y+=P.vy;P.on=false;if(P.y+P.h>=G){P.y=G-P.h;P.vy=0;P.on=true}
 for(const o of obs)if(o.solid&&P.x+P.w-4>o.x&&P.x+4<o.x+o.w){if(P.vy>=0&&P.y+P.h>o.y&&P.y+P.h-P.vy<=o.y+12){P.y=o.y-P.h;P.vy=0;P.on=true}else if(P.vy<0&&P.y<o.y+o.h&&P.y>o.y+o.h-16){P.y=o.y+o.h;P.vy=0}}
 if(P.on&&Math.abs(P.vx)>.5)P.anim+=.25;
 camX=Math.max(camX,P.x-300);dist=Math.max(dist,(P.x-120)/40|0);
 const nl=1+(dist/150|0);if(nl>level){level=nl;msg=120;sfx.level()}
 spawn();
 for(const o of obs){if(o.vx){o.x+=o.vx;o.rot+=o.vx/15}
  if(!o.solid&&hit(P,o,o.k=='lego'?10:8)){if(P.vy>0&&P.y+P.h<o.y+18&&o.k!='lego'){P.vy=-9;score+=5;sfx.jump()}else hurt()}}
 for(const it of items)if(!it.got&&Math.abs(P.x+20-it.x)<36&&Math.abs(P.y+35-it.y)<46){it.got=1;score+=10;sfx.collect();for(let i=0;i<6;i++)parts.push({x:it.x,y:it.y,vx:Math.random()*4-2,vy:-Math.random()*4,l:25,c:'#ffd600',s:'★'})}
 obs=obs.filter(o=>o.x>camX-200);items=items.filter(i=>i.x>camX-100&&!i.got);
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.l--}parts=parts.filter(p=>p.l>0);
 if(inv>0)inv--;if(msg>0)msg--}
// ---- drawing
function rr(x,y,w,h,r,f){X.beginPath();X.roundRect?X.roundRect(x,y,w,h,r):X.rect(x,y,w,h);X.fillStyle=f;X.fill()}
function star(x,y,r,f){X.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r*.45:r;X.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}X.closePath();X.fillStyle=f;X.fill();X.strokeStyle='#f57f17';X.lineWidth=2;X.stroke()}
function bg(){const g=X.createLinearGradient(0,0,0,G);g.addColorStop(0,'#c9ecff');g.addColorStop(1,'#fff3d6');X.fillStyle=g;X.fillRect(0,0,W,G);
 // wallpaper stripes & windows parallax
 const o=-(camX*.3)%120;for(let x=o;x<W;x+=120){X.fillStyle='rgba(255,182,193,.25)';X.fillRect(x,0,60,G)}
 const o2=-(camX*.5)%700;for(let x=o2;x<W+700;x+=700){rr(x+80,60,160,120,10,'#fff');rr(x+90,70,140,100,6,'#7fd3ff');X.fillStyle='#fff';X.beginPath();X.arc(x+130,110,18,0,7);X.arc(x+150,105,22,0,7);X.fill();star(x+200,90,10,'#ffeb3b');
  rr(x+400,140,180,20,4,'#a1887f');for(let i=0;i<4;i++)rr(x+410+i*42,100,30,40,3,BC[i]);X.fillStyle='#8d6e63';X.font='bold 18px sans-serif';}
 // floor
 X.fillStyle='#d7a86e';X.fillRect(0,G,W,H-G);const o3=-camX%80;X.strokeStyle='#c4925a';X.lineWidth=3;for(let x=o3;x<W;x+=80){X.beginPath();X.moveTo(x,G);X.lineTo(x,H);X.stroke()}
 X.fillStyle='#a8d8a8';X.fillRect(0,G,W,8)}
function lego(o){const x=o.x-camX;rr(x,o.y,o.w,o.h,3,o.c);X.fillStyle='rgba(0,0,0,.15)';X.fillRect(x,o.y+o.h-5,o.w,5);for(let i=0;i<o.w/22;i++){rr(x+4+i*22,o.y-7,14,8,3,o.c);X.fillStyle='rgba(255,255,255,.4)';X.fillRect(x+6+i*22,o.y-6,4,3)}}
function block(o){const x=o.x-camX;rr(x,o.y,o.w,o.h,5,o.c);rr(x+5,o.y+5,o.w-10,o.h-10,4,'#fffde7');X.fillStyle=o.c;X.font='bold 30px "Comic Sans MS",sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(o.l,x+25,o.y+27)}
function car(o){const x=o.x-camX,y=o.y;if(o.k=='ball'){X.save();X.translate(x+25,y+10);X.rotate(o.rot);X.beginPath();X.arc(0,0,22,0,7);X.fillStyle='#fff';X.fill();for(let i=0;i<3;i++){X.beginPath();X.moveTo(0,0);X.arc(0,0,22,i*2.1,i*2.1+1);X.fillStyle=BC[i];X.fill()}X.restore();return}
 rr(x,y,50,20,6,o.c);rr(x+10,y-12,28,14,5,o.c);rr(x+14,y-9,20,9,3,'#bbdefb');for(const w of[12,38]){X.beginPath();X.arc(x+w,y+22,8,0,7);X.fillStyle='#333';X.fill();X.beginPath();X.arc(x+w,y+22,3,0,7);X.fillStyle='#ccc';X.fill()}X.fillStyle='#fff';X.beginPath();X.arc(x+12,y+10,3,0,7);X.arc(x+38,y+10,3,0,7);X.fill()}
function hero(x,y,face,anim,air,scale=1){X.save();X.translate(x+20,y+70);X.scale(face*scale,scale);
 const sw=air?0:Math.sin(anim)*0.6,skin='#8d5524',dk='#6b3e1a';
 // legs
 const leg=(a,c)=>{X.save();X.translate(0,-26);X.rotate(a);rr(-6,0,12,18,4,skin);rr(-8,16,20,10,5,c);rr(-8,23,20,3,1,'#fff');X.restore()};
 if(air){leg(-.5,'#e53935');leg(.7,'#e53935')}else{leg(sw,'#e53935');leg(-sw,'#e53935')}
 // shorts
 rr(-14,-34,28,14,4,'#1e88e5');
 // body shirt
 rr(-15,-58,30,28,9,'#ffca28');star(0,-45,7,'#ff7043');
 // arms
 const arm=a=>{X.save();X.translate(0,-54);X.rotate(a);rr(-5,0,10,20,5,skin);X.restore()};
 if(air){arm(-2.6);arm(2.4)}else{arm(-sw*.8);arm(sw*.8)}
 // head
 X.beginPath();X.arc(0,-74,18,0,7);X.fillStyle=skin;X.fill();
 X.beginPath();X.arc(-17,-73,5,0,7);X.fill();
 // curly hair
 X.fillStyle='#1b1009';for(let i=0;i<9;i++){X.beginPath();X.arc(-15+i*3.7,-88+Math.abs(i-4)*1.3,5.5,0,7);X.fill()}X.beginPath();X.arc(-16,-80,5,0,7);X.fill();
 // face
 X.fillStyle='#fff';X.beginPath();X.ellipse(7,-76,4.5,5.5,0,0,7);X.fill();X.fillStyle='#000';X.beginPath();X.arc(8.5,-75.5,2.6,0,7);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(9.3,-77,1,0,7);X.fill();
 X.beginPath();X.arc(7,-67,7,0.15,Math.PI-.15);X.fillStyle='#fff';X.fill();X.strokeStyle=dk;X.lineWidth=2;X.stroke();
 X.fillStyle='rgba(255,120,120,.45)';X.beginPath();X.arc(15,-68,3.5,0,7);X.fill();
 X.restore()}
function txt(s,x,y,sz,c='#fff',st='#5d2fa0'){X.font=`bold ${sz}px "Comic Sans MS","Trebuchet MS",sans-serif`;X.textAlign='center';X.textBaseline='middle';X.lineWidth=sz/6;X.lineJoin="round";X.strokeStyle=st;X.strokeText(s,x,y);X.fillStyle=c;X.fillText(s,x,y)}
function button(s,x,y,w,h,c,sel=true){rr(x-w/2,y-h/2+5,w,h,18,'rgba(0,0,0,.2)');rr(x-w/2,y-h/2,w,h,18,sel?c:'#ccc');txt(s,x,y,h*.45,'#fff','rgba(0,0,0,.35)')}
function draw(){bg();
 if(state=='title'){camX+=1;for(let i=0;i<5;i++)lego({x:camX+90+i*200,y:G-22,w:44,h:22,c:BC[i]});block({x:camX+760,y:G-50,w:50,h:50,c:BC[1],l:'A'});
  txt('LEGO JUMP!',W/2,90,78,'#ffeb3b','#e53935');txt('Help Jayden jump over the toys!',W/2,160,26,'#fff','#1e88e5');
  hero(180,G-70-Math.abs(Math.sin(t/15))*50,1,t/5,Math.sin(t/15)>.3,1.3);
  button('Easy 🐢',W/2-110,300,190,56,'#43a047',diff=='easy');button('Normal 🐇',W/2+110,300,190,56,'#fb8c00',diff=='normal');
  button('▶ PLAY',W/2,390,240,76,'#e53935');txt('← → move   Space/↑ jump   (or tap!)',W/2,470,22,'#fff','#5d4037');if(best)txt('Best: '+best,W/2,510,20,'#ffeb3b','#5d4037');return}
 for(const o of obs)o.k=='lego'?lego(o):o.k=='block'?block(o):car(o);
 for(const it of items){const b=Math.sin(t/10+it.x)*4;star(it.x-camX,it.y+b,15,'#ffd600')}
 if(!(inv>0&&(t>>2)%2))hero(P.x-camX,P.y,P.face,P.anim,!P.on);
 for(const p of parts){X.globalAlpha=p.l/30;txt(p.s,p.x-camX,p.y,20,p.c,'#fff');X.globalAlpha=1}
 // HUD
 rr(10,10,420,44,14,'rgba(255,255,255,.85)');X.textAlign='left';X.font='bold 22px "Comic Sans MS",sans-serif';X.fillStyle='#e53935';X.fillText('❤'.repeat(Math.max(lives,0)),22,34);X.fillStyle='#5d2fa0';X.fillText('★ '+score+'   '+dist+'m   Lv '+level,22+Math.max(lives,1)*0+130,34);
 if(msg>0)txt('Level '+level+'!',W/2,140,56,'#ffeb3b','#e53935');
 if(state=='over'){X.fillStyle='rgba(255,255,255,.6)';X.fillRect(0,0,W,H);txt('Great try! 🎉',W/2,140,64,'#ffeb3b','#e53935');txt('Stars: '+score+'   Distance: '+dist+'m',W/2,230,32,'#fff','#1e88e5');txt('Best: '+best,W/2,280,26,'#fff','#5d4037');button('↻ Play Again',W/2,375,300,76,'#43a047')}}
function loop(){update();draw();requestAnimationFrame(loop)}camX=0;loop();
window.__game={get state(){return state},start,get P(){return P},set diff(v){diff=v}};
</script></body></html>
